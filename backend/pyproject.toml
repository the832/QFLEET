[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "NabajitBhadury", email = "nabajitbhadury@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dwave-ocean-sdk>=9.5.0",
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.4",
    "pyjwt[crypto]>=2.10",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.4",
    "qiskit-ibm-runtime>=0.52.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
